name: ev3-producer-tests
services:
  productos-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ev3_productos_test
      POSTGRES_USER: ev3
      POSTGRES_PASSWORD: ev3-local-only
    ports: ["127.0.0.1:${PRODUCTOS_TEST_PORT:-56432}:5432"]
  carrito-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ev3_carrito_test
      POSTGRES_USER: ev3
      POSTGRES_PASSWORD: ev3-local-only
    ports: ["127.0.0.1:${CARRITO_TEST_PORT:-56431}:5432"]
  kafka:
    image: apache/kafka:4.1.1
    ports: ["127.0.0.1:19092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
