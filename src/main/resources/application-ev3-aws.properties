# Provision/review schema separately. validate never creates/drops legacy tables.
server.port=8080
spring.datasource.url=${PRODUCTOS_DB_URL}
spring.datasource.username=${PRODUCTOS_DB_USER}
spring.datasource.password=${PRODUCTOS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
ev3.kafka.enabled=true
logging.level.org.springframework.security=WARN
