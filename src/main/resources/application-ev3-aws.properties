# Laboratorio AWS: H2 persistente en archivo sobre EBS por defecto (PostgreSQL opcional vía PRODUCTOS_DB_URL)
server.port=${SERVER_PORT:8081}
spring.datasource.url=${PRODUCTOS_DB_URL:jdbc:h2:file:/var/lib/fazbear/productos/productosdb;AUTO_SERVER=FALSE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${PRODUCTOS_DB_USER:sa}
spring.datasource.password=${PRODUCTOS_DB_PASSWORD:}
spring.datasource.driver-class-name=${PRODUCTOS_DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${PRODUCTOS_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${PRODUCTOS_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.h2.console.enabled=false
ev3.kafka.enabled=${EV3_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
logging.level.org.springframework.security=WARN
